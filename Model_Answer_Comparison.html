<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice: Explaining Boosts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fira Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #F2F4F7;
            padding: 20px;
            color: #24272B;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Progress Indicator */
        .scenario-progress {
            text-align: center;
            margin-bottom: 25px;
            font-size: 14px;
            font-weight: 600;
            color: #24272B;
        }

        /* Scenario Card */
        .scenario-card {
            background: white;
            border: 2px solid #DDE0E5;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .scenario-header {
            font-size: 18px;
            font-weight: 700;
            color: #13297A;
            margin-bottom: 15px;
        }

        .pro-quote {
            background-color: #F7F8FA;
            border-left: 4px solid #2D8CFF;
            padding: 20px;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.6;
            color: #24272B;
            font-style: italic;
            margin-bottom: 25px;
        }

        .instruction-text {
            font-size: 15px;
            color: #24272B;
            margin-bottom: 15px;
            font-weight: 500;
        }

        /* Response Area */
        .response-area {
            margin-bottom: 20px;
        }

        .response-label {
            font-size: 15px;
            font-weight: 600;
            color: #24272B;
            margin-bottom: 8px;
            display: block;
        }

        .response-textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #DDE0E5;
            border-radius: 8px;
            font-family: 'Fira Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            color: #24272B;
            resize: vertical;
            transition: border-color 0.2s;
        }

        .response-textarea:focus {
            outline: none;
            border-color: #2D8CFF;
        }

        /* Submit Button */
        .submit-btn {
            background-color: #2D8CFF;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Fira Sans', sans-serif;
        }

        .submit-btn:hover {
            background-color: #13297A;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(45, 140, 255, 0.2);
        }

        .submit-btn:disabled {
            background-color: #C9CDD3;
            cursor: not-allowed;
            transform: none;
        }

        /* Comparison View */
        .comparison-container {
            display: none;
            margin-top: 30px;
        }

        .comparison-container.active {
            display: block;
        }

        .comparison-header {
            font-size: 20px;
            font-weight: 700;
            color: #24272B;
            margin-bottom: 20px;
            text-align: center;
        }

        .side-by-side {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .response-column {
            background-color: #F7F8FA;
            border-radius: 12px;
            padding: 20px;
        }

        .response-column.your-response {
            border: 2px solid #DDE0E5;
        }

        .response-column.model-response {
            border: 2px solid #F6EBFE;
            background-color: #F6EBFE;
        }

        .column-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            color: #24272B;
        }

        .column-content {
            font-size: 15px;
            line-height: 1.6;
            color: #24272B;
        }

        /* Key Elements */
        .key-elements {
            background-color: #EAF3FF;
            border: 2px solid #2D8CFF;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .key-elements-title {
            font-size: 16px;
            font-weight: 700;
            color: #13297A;
            margin-bottom: 15px;
        }

        .key-elements-list {
            list-style: none;
            padding: 0;
        }

        .key-elements-list li {
            padding: 8px 0 8px 28px;
            position: relative;
            font-size: 15px;
            line-height: 1.5;
            color: #24272B;
        }

        .key-elements-list li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #13297A;
            font-weight: 700;
            font-size: 16px;
        }

        /* Navigation Buttons */
        .navigation {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 25px;
        }

        .nav-btn {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Fira Sans', sans-serif;
        }

        .nav-btn-secondary {
            background-color: #E8EBF0;
            color: #24272B;
        }

        .nav-btn-secondary:hover {
            background-color: #DDE0E5;
        }

        .nav-btn-primary {
            background-color: #2D8CFF;
            color: white;
        }

        .nav-btn-primary:hover {
            background-color: #13297A;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(45, 140, 255, 0.2);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* Completion Screen */
        .completion-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .completion-screen.active {
            display: block;
        }

        .completion-icon {
            width: 80px;
            height: 80px;
            background-color: #F6EBFE;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .completion-icon svg {
            width: 40px;
            height: 40px;
            fill: #24272B;
        }

        .completion-title {
            font-size: 24px;
            font-weight: 700;
            color: #24272B;
            margin-bottom: 15px;
        }

        .completion-message {
            font-size: 16px;
            line-height: 1.6;
            color: #24272B;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .scenario-card {
                padding: 20px;
            }

            .side-by-side {
                grid-template-columns: 1fr;
            }

            .navigation {
                flex-direction: column;
            }

            .nav-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Progress Indicator -->
        <div class="scenario-progress" id="progressText">Scenario 1 of 3</div>

        <!-- Scenario Container -->
        <div id="scenarioContainer">
            <!-- Scenarios will be rendered here -->
        </div>

        <!-- Completion Screen -->
        <div class="completion-screen" id="completionScreen">
            <div class="completion-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                </svg>
            </div>
            <div class="completion-title">Excellent Work!</div>
            <div class="completion-message">
                You've practiced explaining Boosts billing in three different scenarios. You're now ready to confidently handle pro questions about real-time billing and the difference between subscription leads and Boost leads.
            </div>
            <button class="nav-btn nav-btn-secondary" onclick="restartPractice()">Practice Again</button>
        </div>
    </div>

    <script>
        const scenarios = [
            {
                number: 1,
                quote: "This lead shows a dollar amount and says 'in addition to your subscription'. How is this different from my normal leads?",
                modelAnswer: "I understand the confusion. Boosts are a separate feature from your subscription leads. The 'in addition to your subscription' means this lead requires an extra payment beyond your monthly subscription budget. You'll see Boosts when we have an unfilled homeowner request that you may be a good fit for. This gives you access to more leads beyond what your subscription provides, so you can keep growing your business even after you've used your monthly budget.",
                keyElements: [
                    "Boosts are separate from subscription leads",
                    "Explained what 'in addition to subscription' means (extra payment)",
                    "Emphasized the value (access to MORE leads)",
                    "Used certainty ('This gives you') rather than hesitation ('This might give you')"
                ]
            },
            {
                number: 2,
                quote: "I see a lead charge for $84 on my credit card, but I don't pay for my leads because of my subscription, so why is it showing that way?",
                modelAnswer: "That $84 lead is from a Boost, which is different from leads you receive with your subscription. Your subscription covers a set dollar amount each month, but Boosts are available for purchase in addition to your subscription. You were charged $84 when you accepted this Boost. Boosts allow you to get additional leads beyond your subscription, which is especially useful when you've reached your subscription value but still want more leads.",
                keyElements: [
                    "Clearly distinguished Boosts from subscription leads",
                    "Explained when they're charged (when they accept)",
                    "Used 'in addition to' language",
                    "Stated the value proposition (additional leads beyond subscription)",
                    "Spoke with certainty ('You were charged') not hesitation ('You might have been charged')"
                ]
            },
            {
                number: 3,
                quote: "I got charged $52 this morning when I was reviewing my leads. I don't understand why I was charged for looking at this lead when I paid for my subscription at the beginning of the month",
                modelAnswer: "I understand the confusion. That $52 charge was triggered when you tapped 'Accept' on a Boost, not while you were reviewing it. Boosts are separate from your subscription and are charged immediately in real time when you accept them. Your subscription covers your monthly leads, but Boosts are additional service requests available for purchase when you want to take on more work.",
                keyElements: [
                    "Opened with empathy (\"I understand the confusion\")",
                    "Clarified the misunderstanding (charged for accepting, not viewing)",
                    "Explained real-time billing clearly",
                    "Distinguished between subscription and Boosts",
                    "Explained when charging happens (immediately when accepting)",
                    "No jargon, customer-focused language",
                    "Used certainty throughout"
                ]
            }
        ];

        let currentScenario = 0;
        let userResponses = ['', '', ''];
        let hasSubmitted = [false, false, false];

        function renderScenario() {
            const scenario = scenarios[currentScenario];
            const container = document.getElementById('scenarioContainer');
            
            const showingComparison = hasSubmitted[currentScenario];
            
            container.innerHTML = `
                <div class="scenario-card">
                    <div class="scenario-header">Scenario ${scenario.number}</div>
                    <div class="pro-quote">"${scenario.quote}"</div>
                    
                    ${!showingComparison ? `
                        <div class="instruction-text">How would you respond to this pro? Type your answer below:</div>
                        <div class="response-area">
                            <label class="response-label">Your Response:</label>
                            <textarea 
                                class="response-textarea" 
                                id="userResponse" 
                                placeholder="Type your response here..."
                            >${userResponses[currentScenario]}</textarea>
                        </div>
                        <button class="submit-btn" onclick="submitResponse()" id="submitBtn">
                            Submit Response
                        </button>
                    ` : `
                        <div class="comparison-container active">
                            <div class="comparison-header">Compare Your Response</div>
                            
                            <div class="side-by-side">
                                <div class="response-column your-response">
                                    <div class="column-title">Your Response</div>
                                    <div class="column-content">${userResponses[currentScenario] || '<em>No response provided</em>'}</div>
                                </div>
                                
                                <div class="response-column model-response">
                                    <div class="column-title">Model Answer</div>
                                    <div class="column-content">${scenario.modelAnswer}</div>
                                </div>
                            </div>
                            
                            <div class="key-elements">
                                <div class="key-elements-title">Key Elements in This Response:</div>
                                <ul class="key-elements-list">
                                    ${scenario.keyElements.map(element => `<li>${element}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                    `}
                </div>
                
                <div class="navigation">
                    <button class="nav-btn nav-btn-secondary" onclick="previousScenario()" ${currentScenario === 0 ? 'disabled' : ''}>
                        Previous Scenario
                    </button>
                    <button class="nav-btn nav-btn-primary" onclick="nextScenario()" ${!showingComparison ? 'disabled' : ''}>
                        ${currentScenario === scenarios.length - 1 ? 'Complete' : 'Next Scenario'}
                    </button>
                </div>
            `;
            
            updateProgress();
            
            // Auto-resize textarea as user types
            if (!showingComparison) {
                const textarea = document.getElementById('userResponse');
                textarea.addEventListener('input', function() {
                    userResponses[currentScenario] = this.value;
                    updateSubmitButton();
                });
                updateSubmitButton();
            }
        }

        function updateSubmitButton() {
            const btn = document.getElementById('submitBtn');
            const textarea = document.getElementById('userResponse');
            if (btn && textarea) {
                btn.disabled = textarea.value.trim().length === 0;
            }
        }

        function submitResponse() {
            const textarea = document.getElementById('userResponse');
            userResponses[currentScenario] = textarea.value;
            hasSubmitted[currentScenario] = true;
            renderScenario();
        }

        function updateProgress() {
            document.getElementById('progressText').textContent = `Scenario ${currentScenario + 1} of ${scenarios.length}`;
        }

        function previousScenario() {
            if (currentScenario > 0) {
                currentScenario--;
                renderScenario();
            }
        }

        function nextScenario() {
            if (currentScenario < scenarios.length - 1) {
                currentScenario++;
                renderScenario();
            } else {
                showCompletion();
            }
        }

        function showCompletion() {
            document.getElementById('scenarioContainer').style.display = 'none';
            document.getElementById('progressText').style.display = 'none';
            document.getElementById('completionScreen').classList.add('active');
        }

        function restartPractice() {
            currentScenario = 0;
            userResponses = ['', '', ''];
            hasSubmitted = [false, false, false];
            
            document.getElementById('scenarioContainer').style.display = 'block';
            document.getElementById('progressText').style.display = 'block';
            document.getElementById('completionScreen').classList.remove('active');
            
            renderScenario();
        }

        // Initialize
        renderScenario();
    </script>
</body>
</html>
