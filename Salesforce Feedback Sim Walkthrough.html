<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit feedback on a knowledge article</title>
<style>
  :root{
    --heart-100:#FC5647;
    --btn-primary:#FC4647;
    --btn-primary-press:#912F24;
    --snow:#FFFFFF;
    --charcoal-500:#282827;
    --charcoal-100:#F5F5F2;
    --border:#E2E2DD;
    --fg-muted:#5C5C5B;
    --focus-ring:#FC5647;
    --radius-sm:10px;
    --radius-md:14px;
    --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--snow);
    font-family:"Fira Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    color:var(--charcoal-500);
  }
  .kbw{
    max-width:1040px;
    margin:0 auto;
    padding:20px 16px 32px;
  }
  .kbw-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
  }
  .kbw-eyebrow{
    font-size:12px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--fg-muted);
    margin:0 0 4px;
  }
  .kbw-title{
    font-size:20px;
    line-height:1.3;
    font-weight:700;
    margin:0;
  }
  .kbw-restart{
    background:none;
    border:none;
    color:var(--fg-muted);
    font-size:14px;
    font-weight:500;
    text-decoration:underline;
    cursor:pointer;
    padding:8px 4px;
    white-space:nowrap;
    font-family:inherit;
  }
  .kbw-restart:hover{color:var(--charcoal-500);}
  .kbw-progress{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:16px;
  }
  .kbw-dot{
    width:10px;
    height:10px;
    border-radius:999px;
    border:1.5px solid var(--border);
    background:var(--snow);
    flex:0 0 auto;
  }
  .kbw-dot.done{background:var(--charcoal-500);border-color:var(--charcoal-500);}
  .kbw-dot.current{border-color:var(--charcoal-500);border-width:2px;}
  .kbw-step-count{
    font-size:14px;
    color:var(--fg-muted);
    margin-left:4px;
  }
  .kbw-stage{
    position:relative;
    width:100%;
    border:1.5px solid var(--charcoal-500);
    border-radius:var(--radius-md);
    overflow:hidden;
    background:var(--charcoal-100);
  }
  .kbw-img-wrap{
    position:relative;
    width:100%;
    line-height:0;
  }
  .kbw-img-wrap img{
    display:block;
    width:100%;
    height:auto;
  }
  .kbw-catcher{
    position:absolute;
    top:0;left:0;right:0;bottom:0;
    border:none;
    background:transparent;
    padding:0;
    margin:0;
    cursor:pointer;
    z-index:1;
  }
  .kbw-hotspot{
    position:absolute;
    min-width:44px;
    min-height:44px;
    border:none;
    border-radius:var(--radius-sm);
    background:transparent;
    cursor:pointer;
    z-index:2;
    padding:0;
  }
  .kbw-hotspot:focus-visible{
    outline:3px solid var(--focus-ring);
    outline-offset:3px;
  }
  .kbw-textarea{
    position:absolute;
    z-index:2;
    resize:none;
    border:1.5px solid var(--charcoal-500);
    border-radius:var(--radius-sm);
    background:var(--snow);
    font-family:inherit;
    font-size:15px;
    padding:10px;
    color:var(--charcoal-500);
  }
  .kbw-textarea:focus-visible{
    outline:3px solid var(--focus-ring);
    outline-offset:2px;
  }
  .kbw-hint{
    position:absolute;
    left:50%;
    bottom:10px;
    transform:translateX(-50%);
    background:var(--charcoal-500);
    color:var(--snow);
    font-size:13px;
    font-weight:500;
    padding:8px 14px;
    border-radius:var(--radius-sm);
    z-index:3;
    opacity:0;
    pointer-events:none;
    transition:opacity 200ms ease;
    max-width:88%;
    text-align:center;
  }
  .kbw-hint.show{opacity:1;}
  .kbw-callout{
    margin-top:16px;
    background:var(--snow);
    border:1.5px solid var(--charcoal-500);
    border-radius:var(--radius-md);
    padding:16px 18px;
  }
  .kbw-callout-title{
    font-size:16px;
    font-weight:700;
    margin:0 0 4px;
  }
  .kbw-callout-body{
    font-size:16px;
    line-height:1.55;
    margin:0;
    color:var(--charcoal-500);
  }
  .kbw-done{
    display:none;
    text-align:center;
    padding:36px 20px;
    background:var(--snow);
    border:1.5px solid var(--charcoal-500);
    border-radius:var(--radius-md);
  }
  .kbw-done.show{display:block;}
  .kbw-stage.hidden, .kbw-callout.hidden{display:none;}
  .kbw-done-title{
    font-size:24px;
    font-weight:700;
    margin:0 0 8px;
  }
  .kbw-done-body{
    font-size:16px;
    line-height:1.55;
    color:var(--charcoal-500);
    margin:0 0 20px;
  }
  .kbw-primary-btn{
    display:inline-block;
    background:var(--btn-primary);
    color:var(--snow);
    border:2px solid var(--btn-primary);
    border-radius:var(--radius-pill);
    padding:12px 22px;
    min-height:44px;
    min-width:160px;
    font-size:16px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
  }
  .kbw-primary-btn:hover{background:var(--btn-primary-press);border-color:var(--btn-primary-press);}
  .kbw-primary-btn:focus-visible{outline:3px solid var(--focus-ring);outline-offset:3px;}
  .kbw-sr-only{
    position:absolute;
    width:1px;height:1px;
    overflow:hidden;
    clip:rect(0 0 0 0);
    white-space:nowrap;
  }
</style>
</head>
<body>
<div class="kbw" role="region" aria-label="Interactive walkthrough: submit feedback on a knowledge article">

  <div class="kbw-header">
    <div>
      <p class="kbw-eyebrow">Salesforce knowledge articles</p>
      <h3 class="kbw-title">Submit feedback on an article</h3>
    </div>
    <button type="button" class="kbw-restart" id="kbwRestart">Restart</button>
  </div>

  <div class="kbw-progress" id="kbwProgress" aria-hidden="true">
    <span class="kbw-dot" data-dot="1"></span>
    <span class="kbw-dot" data-dot="2"></span>
    <span class="kbw-dot" data-dot="3"></span>
    <span class="kbw-dot" data-dot="4"></span>
    <span class="kbw-dot" data-dot="5"></span>
    <span class="kbw-dot" data-dot="6"></span>
    <span class="kbw-step-count" id="kbwStepCount">Step 1 of 6</span>
  </div>
  <p class="kbw-sr-only" id="kbwLive" aria-live="polite"></p>

  <div class="kbw-stage" id="kbwStage">
    <div class="kbw-img-wrap" id="kbwImgWrap">
      <img id="kbwImg" src="" alt="Screenshot of the Salesforce knowledge article feedback widget">
      <button type="button" class="kbw-catcher" id="kbwCatcher" aria-hidden="true" tabindex="-1"></button>
      <div class="kbw-hint" id="kbwHint"></div>
      <!-- step-specific interactive elements are injected here by JS -->
    </div>
  </div>

  <div class="kbw-callout" id="kbwCallout">
    <p class="kbw-callout-title" id="kbwCalloutTitle"></p>
    <p class="kbw-callout-body" id="kbwCalloutBody"></p>
  </div>

  <div class="kbw-done" id="kbwDone">
    <p class="kbw-done-title">You're all set</p>
    <p class="kbw-done-body">You just helped keep our knowledge base accurate. This same process works for any knowledge article in Salesforce, any time you spot something that needs a second look.</p>
    <button type="button" class="kbw-primary-btn" id="kbwRestart2">Restart walkthrough</button>
  </div>

</div>

  };

  var img = document.getElementById('kbwImg');
  var wrap = document.getElementById('kbwImgWrap');
  var catcher = document.getElementById('kbwCatcher');
  var hint = document.getElementById('kbwHint');
  var calloutTitle = document.getElementById('kbwCalloutTitle');
  var calloutBody = document.getElementById('kbwCalloutBody');
  var stage = document.getElementById('kbwStage');
  var callout = document.getElementById('kbwCallout');
  var doneEl = document.getElementById('kbwDone');
  var stepCount = document.getElementById('kbwStepCount');
  var live = document.getElementById('kbwLive');
  var dots = document.querySelectorAll('.kbw-dot');

  var state = 1; // 1-4 simple steps, 5 = form (typing), 6 = form (ready to submit)
  var hasTyped = false;
  var dynamicEls = [];

  function clearDynamic(){
    dynamicEls.forEach(function(el){ if(el.parentNode) el.parentNode.removeChild(el); });
    dynamicEls = [];
  }

  function addHotspot(rect, ariaLabel, onClick){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'kbw-hotspot';
    b.style.left = rect.left; b.style.top = rect.top;
    b.style.width = rect.width; b.style.height = rect.height;
    b.setAttribute('aria-label', ariaLabel);
    b.addEventListener('click', function(e){ e.stopPropagation(); onClick(); });
    wrap.appendChild(b);
    dynamicEls.push(b);
    return b;
  }

  function addTextarea(rect, placeholder, onInput){
    var t = document.createElement('textarea');
    t.className = 'kbw-textarea';
    t.style.left = rect.left; t.style.top = rect.top;
    t.style.width = rect.width; t.style.height = rect.height;
    t.setAttribute('aria-label', 'Feedback text box');
    t.placeholder = placeholder;
    t.addEventListener('input', onInput);
    wrap.appendChild(t);
    dynamicEls.push(t);
    return t;
  }

  function showHint(msg){
    hint.textContent = msg;
    hint.classList.add('show');
    window.clearTimeout(showHint._t);
    showHint._t = window.setTimeout(function(){ hint.classList.remove('show'); }, 2200);
  }

  function updateProgress(displayStep){
    dots.forEach(function(d){
      var n = parseInt(d.getAttribute('data-dot'), 10);
      d.classList.remove('done','current');
      if(n < displayStep) d.classList.add('done');
      if(n === displayStep) d.classList.add('current');
    });
    stepCount.textContent = 'Step ' + displayStep + ' of 6';
  }

  function announce(msg){ live.textContent = msg; }

  function render(){
    clearDynamic();
    catcher.onclick = null;

    if(state === 1){
      img.src = IMAGES.full;
      img.alt = "A knowledge article in Salesforce, with the feedback widget in the upper right.";
      updateProgress(1);
      calloutTitle.textContent = 'Find the feedback widget';
      calloutBody.textContent = "Every knowledge article has a feedback widget called \u201cWas this article helpful?\u201d Click it to get started.";
      catcher.onclick = function(){ showHint('Look for "Was this article helpful?" near the top of the article.'); };
      addHotspot(
        { left:'65%', top:'29%', width:'34%', height:'11%' },
        'Was this article helpful widget',
        function(){ state = 2; render(); announce('Step 2 of 6'); }
      );
    }

    else if(state === 2){
      img.src = IMAGES.widget;
      img.alt = "A close-up of the feedback widget, with thumbs-up and thumbs-down icons.";
      updateProgress(2);
      calloutTitle.textContent = 'Flag the problem';
      calloutBody.textContent = "You noticed something wrong in this article, so you'll leave feedback that helps the article owner fix it. Click the thumbs-down icon.";
      catcher.onclick = function(){ showHint('Click the thumbs-down icon, not thumbs-up.'); };
      addHotspot(
        { left:'89%', top:'38%', width:'8%', height:'32%' },
        'Thumbs down icon',
        function(){ state = 3; render(); announce('Step 3 of 6'); }
      );
    }

    else if(state === 3){
      img.src = IMAGES.dropdownClosed;
      img.alt = "The expanded feedback form, with a dropdown labeled Choose a general reason and a feedback text box.";
      updateProgress(3);
      calloutTitle.textContent = 'Open the reason list';
      calloutBody.textContent = "Clicking thumbs-down opens a short form. Click the dropdown to see your feedback options.";
      catcher.onclick = function(){ showHint('Click the "Choose a general reason" dropdown.'); };
      addHotspot(
        { left:'2%', top:'33%', width:'96%', height:'13%' },
        'Choose a general reason dropdown',
        function(){ state = 4; render(); announce('Step 4 of 6'); }
      );
    }

    else if(state === 4){
      img.src = IMAGES.dropdownOpen;
      img.alt = "The reason dropdown, open and showing four options, including The article is inaccurate.";
      updateProgress(4);
      calloutTitle.textContent = 'Pick your reason';
      calloutBody.textContent = "Since the information in the article was wrong, choose \u201cThe article is inaccurate.\u201d";
      catcher.onclick = function(){ showHint('Choose "The article is inaccurate" from the list.'); };
      addHotspot(
        { left:'2%', top:'80.5%', width:'96%', height:'9.5%' },
        'The article is inaccurate option',
        function(){ state = 5; hasTyped = false; render(); announce('Step 5 of 6'); }
      );
    }

    else if(state === 5 || state === 6){
      img.src = IMAGES.feedbackForm;
      img.alt = "The feedback form with The article is inaccurate selected, a feedback text box, and a Submit button.";
      updateFormCopy();

      catcher.onclick = function(){
        showHint(hasTyped ? 'Click Submit to finish.' : 'Type a quick note in the feedback box first.');
      };

      addTextarea(
        { left:'2%', top:'61%', width:'96%', height:'19%' },
        'e.g. This article says billing is monthly, but subscribers are billed weekly.',
        function(e){
          var typedNow = e.target.value.trim().length > 0;
          if(typedNow !== hasTyped){
            hasTyped = typedNow;
            updateFormCopy();
            announce(hasTyped ? 'Step 6 of 6' : 'Step 5 of 6');
          }
        }
      );

      addHotspot(
        { left:'44%', top:'82%', width:'15%', height:'14%' },
        'Submit button',
        function(){
          if(!hasTyped){
            showHint('Type a quick note in the feedback box first.');
            return;
          }
          stage.classList.add('hidden');
          callout.classList.add('hidden');
          doneEl.classList.add('show');
          announce('Feedback submitted. Walkthrough complete.');
        }
      );
    }
  }

  function updateFormCopy(){
    updateProgress(hasTyped ? 6 : 5);
    if(!hasTyped){
      calloutTitle.textContent = 'Add the details';
      calloutBody.textContent = "Type a quick note about what's inaccurate, so the article owner knows exactly what to fix.";
    } else {
      calloutTitle.textContent = 'Send your feedback';
      calloutBody.textContent = "Nice work. Click Submit to send your feedback.";
    }
  }

  function restart(){
    state = 1;
    hasTyped = false;
    stage.classList.remove('hidden');
    callout.classList.remove('hidden');
    doneEl.classList.remove('show');
    render();
    announce('Step 1 of 6');
  }

  document.getElementById('kbwRestart').addEventListener('click', restart);
  document.getElementById('kbwRestart2').addEventListener('click', restart);

  render();
})();
</script>
