<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 2 Complete – Expert Communicator</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sandstone: #FFF7ED;
    --snow: #FFFFFF;
    --charcoal-100: #F2F4F7;
    --charcoal-500: #24272B;
    --heart-100: #2D8CFF;
    --heart-600: #13297A;
    --spring-100: #F6EBFE;
    --spring-200: #E8CEFD;
    --green-dark: #4A1D7A;
    --border: #DDE0E5;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --shadow: 0 2px 16px rgba(36,39,43,0.07);
    --shadow-card: 0 4px 24px rgba(36,39,43,0.10);
  }

  body {
    font-family: 'Fira Sans', sans-serif;
    background: var(--snow);
    color: var(--charcoal-500);
    min-height: 100vh;
    padding: 36px 20px 56px;
  }

  .container { max-width: 860px; margin: 0 auto; }

  /* ── Celebration banner ── */
  .celebration {
    background: var(--heart-100);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding: 36px 36px 32px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .celebration::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 70% 30%, rgba(255,255,255,0.12) 0%, transparent 60%);
    pointer-events: none;
  }
  .celebration-icon {
    font-size: 52px;
    margin-bottom: 14px;
    display: block;
    animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .celebration h1 {
    font-size: clamp(22px, 4vw, 26px);
    font-weight: 700;
    color: var(--snow);
    margin-bottom: 10px;
    line-height: 1.2;
  }
  .celebration p {
    font-size: 17px;
    color: rgba(255,255,255,0.9);
    line-height: 1.6;
    max-width: 460px;
    margin: 0 auto;
  }

  /* ── Reflection card ── */
  .reflection-card {
    background: var(--snow);
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    padding: 32px 36px 36px;
    box-shadow: var(--shadow-card);
  }

  .reflection-intro {
    font-size: 17px;
    line-height: 1.6;
    color: var(--charcoal-500);
    margin-bottom: 28px;
    padding-bottom: 24px;
    border-bottom: 2px solid var(--charcoal-100);
  }

  /* ── Questions ── */
  .question-block { margin-bottom: 28px; }
  .question-block:last-of-type { margin-bottom: 0; }

  .question-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 700;
    color: var(--charcoal-500);
    margin-bottom: 12px;
  }
  .q-num {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--heart-100);
    color: var(--snow);
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* Radio options */
  .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }

  .option-radio {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--charcoal-100);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    cursor: pointer;
    transition: all 0.18s ease;
    user-select: none;
  }
  .option-radio:hover {
    border-color: var(--charcoal-500);
    background: #E8EBF0;
  }
  .option-radio.selected {
    border-color: var(--heart-100);
    background: #EAF3FF;
  }
  .option-radio input[type="radio"] { display: none; }
  .radio-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.18s;
    background: var(--snow);
  }
  .option-radio.selected .radio-dot {
    border-color: var(--heart-100);
    background: var(--heart-100);
  }
  .option-radio.selected .radio-dot::after {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--snow);
    display: block;
  }
  .option-text {
    font-size: 17px;
    font-weight: 500;
    color: var(--charcoal-500);
    line-height: 1.4;
  }

  /* Divider between questions */
  .q-divider {
    height: 2px;
    background: var(--charcoal-100);
    margin: 28px 0;
  }

  /* ── Submit button ── */
  .submit-wrap { margin-top: 32px; text-align: center; }
  .btn-submit {
    display: inline-block;
    padding: 14px 40px;
    border-radius: 99px;
    font-family: 'Fira Sans', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    background: var(--heart-100);
    color: var(--snow);
    box-shadow: 0 4px 16px rgba(45,140,255,0.30);
    transition: all 0.22s ease;
    letter-spacing: 0.02em;
  }
  .btn-submit:hover:not(:disabled) {
    background: #13297A;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(45,140,255,0.38);
  }
  .btn-submit:disabled {
    background: #D5D9DF;
    color: #8A9099;
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }

  /* ── Commitment card (shown after submit) ── */
  .commitment-card {
    display: none;
    background: var(--spring-100);
    border: 2px solid var(--green-dark);
    border-radius: var(--radius-md);
    padding: 24px 26px;
    margin-top: 24px;
    animation: fadeSlideIn 0.4s ease;
  }
  .commitment-card.show { display: block; }

  .commitment-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .commitment-icon { font-size: 26px; }
  .commitment-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--green-dark);
  }
  .commitment-body {
    font-size: 17px;
    line-height: 1.65;
    color: #24272B;
  }
  .commitment-body strong { color: var(--green-dark); }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Reflection card -->
  <div class="reflection-card" style="border-radius: var(--radius-lg)">

    <p class="reflection-intro">Now it is time to put that knowledge into action. Take a moment to reflect on your own experience and make a personal commitment before you move on.</p>

    <!-- Question 1 -->
    <div class="question-block">
      <div class="question-label">
        <div class="q-num">1</div>
        Which trigger cue do you find yourself experiencing most often?
      </div>
      <div class="options" id="q1-options">
        <label class="option-radio" onclick="selectOption('q1', 'Physical Tension', this)">
          <input type="radio" name="q1">
          <div class="radio-dot"></div>
          <div class="option-text">Physical Tension</div>
        </label>
        <label class="option-radio" onclick="selectOption('q1', 'Rushing', this)">
          <input type="radio" name="q1">
          <div class="radio-dot"></div>
          <div class="option-text">Rushing</div>
        </label>
        <label class="option-radio" onclick="selectOption('q1', 'Checking Out', this)">
          <input type="radio" name="q1">
          <div class="radio-dot"></div>
          <div class="option-text">Checking Out</div>
        </label>
        <label class="option-radio" onclick="selectOption('q1', 'Flat Tone', this)">
          <input type="radio" name="q1">
          <div class="radio-dot"></div>
          <div class="option-text">Flat Tone</div>
        </label>
      </div>
    </div>

    <div class="q-divider"></div>

    <!-- Question 2 -->
    <div class="question-block">
      <div class="question-label">
        <div class="q-num">2</div>
        Which reset will you commit to trying on your next call?
      </div>
      <div class="options" id="q2-options">
        <label class="option-radio" onclick="selectOption('q2', 'Release Physical Tension', this)">
          <input type="radio" name="q2">
          <div class="radio-dot"></div>
          <div class="option-text">Release Physical Tension</div>
        </label>
        <label class="option-radio" onclick="selectOption('q2', 'Slow Your Pace', this)">
          <input type="radio" name="q2">
          <div class="radio-dot"></div>
          <div class="option-text">Slow Your Pace</div>
        </label>
        <label class="option-radio" onclick="selectOption('q2', 'Reconnect with the Customer', this)">
          <input type="radio" name="q2">
          <div class="radio-dot"></div>
          <div class="option-text">Reconnect with the Customer</div>
        </label>
        <label class="option-radio" onclick="selectOption('q2', 'Smile While You Speak', this)">
          <input type="radio" name="q2">
          <div class="radio-dot"></div>
          <div class="option-text">Smile While You Speak</div>
        </label>
      </div>
    </div>

    <!-- Submit -->
    <div class="submit-wrap">
      <button class="btn-submit" id="submit-btn" onclick="submitReflection()" disabled>Save My Commitment</button>
    </div>

    <!-- Commitment confirmation -->
    <div class="commitment-card" id="commitment-card">
      <div class="commitment-header">
        <span class="commitment-icon">📌</span>
        <div class="commitment-title">Your Commitment</div>
      </div>
      <div class="commitment-body" id="commitment-body"></div>
    </div>

  </div>
</div>

<script>
  // ── Replace this URL with your Google Apps Script web app URL ──
  // ── Add column headers to your Sheet: Timestamp | Module | Trigger | Reset ──
  const SHEET_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';

  const answers = { q1: null, q2: null };

  function selectOption(question, value, el) {
    answers[question] = value;

    // Update selected state for this question's options
    const group = el.closest('.options');
    group.querySelectorAll('.option-radio').forEach(opt => opt.classList.remove('selected'));
    el.classList.add('selected');

    // Enable submit once both answered
    document.getElementById('submit-btn').disabled = !(answers.q1 && answers.q2);
  }

  function submitReflection() {
    const trigger = answers.q1;
    const reset = answers.q2;

    // Show commitment card
    document.getElementById('commitment-body').innerHTML =
      `You identified <strong>${trigger}</strong> as your most common trigger cue.<br>
       On your next call, you'll try the <strong>${reset}</strong> reset.<br><br>
       You have the tools. You know the signals. Now it's just practice.`;

    document.getElementById('commitment-card').classList.add('show');
    document.getElementById('submit-btn').disabled = true;
    document.getElementById('submit-btn').textContent = '✓ Committed!';

    // Lock options
    document.querySelectorAll('.option-radio').forEach(opt => {
      opt.style.pointerEvents = 'none';
      opt.style.cursor = 'default';
    });

    // Scroll to commitment card
    document.getElementById('commitment-card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    // ── Send to Google Sheets (if URL is set) ──
    if (SHEET_URL && SHEET_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
      const payload = {
        timestamp: new Date().toLocaleString(),
        module: 'Module 2 – Checking Your Pulse',
        trigger: trigger,
        reset: reset
      };
      fetch(SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(() => {
        // Fail silently — learner experience is unaffected
      });
    }
  }
</script>
</body>
</html>
